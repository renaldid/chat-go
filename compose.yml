services:
  postgres:
    image: postgres:17-alpine
    container_name: chat-go-postgres
    environment:
      POSTGRES_DB: chat_go
      POSTGRES_USER: chat_go
      POSTGRES_PASSWORD: chat_go
    ports:
      - "5432:5432"
    volumes:
      - chat_go_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_go -d chat_go"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  chat_go_postgres_data:
